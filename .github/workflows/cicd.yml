name: CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  cicd:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

   steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Build and test project
        run: dotnet test --configuration Release

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: pvorselaars
          
      - name: Pack and push to NuGet.org
        if: github.event_name == 'push'
        run: |
          dotnet pack --no-build --output ./nupkg
          dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
